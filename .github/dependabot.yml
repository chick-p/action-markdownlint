version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
    cooldown:
      default-days: 3
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: saturday
    cooldown:
      default-days: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    cooldown:
      default-days: 3
    groups:
      markdownlint:
        patterns:
          - markdownlint
          - markdownlint-cli
